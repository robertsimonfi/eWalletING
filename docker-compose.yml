services:
  identity-provider:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./identity-provider/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  legacy-core-soap:
    build: ./legacy-core-soap
    ports:
      - "8081:8081"
      - "5005:5005" # remote debug port — attach IntelliJ here
    environment:
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  core-facade-rest:
    build: ./core-facade-rest
    ports:
      - "8082:8082"   # HTTPS, mTLS required — see server.ssl.client-auth
      - "8092:8092"   # plain-HTTP health/metrics only, see application.yml
      - "5006:5005" # remote debug port — attach IntelliJ here
    volumes:
      - ./pki/certs:/certs:ro
    environment:
      SOAP_ENDPOINT: http://legacy-core-soap:8081/ws
      KEYCLOAK_JWK_SET_URI: http://identity-provider:8080/realms/ewalleting/protocol/openid-connect/certs
      SSL_KEY_STORE: /certs/core-facade-server.p12
      SSL_TRUST_STORE: /certs/truststore.p12
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      legacy-core-soap:
        condition: service_healthy
      identity-provider:
        condition: service_healthy
    healthcheck:
      # The main port requires a client certificate at the TLS layer — a healthcheck
      # has none, so it hits the separate plain-HTTP management port instead.
      test: ["CMD", "curl", "-f", "http://localhost:8092/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"   # HTTPS
      - "5007:5005" # remote debug port — attach IntelliJ here
    volumes:
      - ./pki/certs:/certs:ro
    environment:
      CORE_FACADE_BASE_URL: https://core-facade-rest:8082
      KEYCLOAK_TOKEN_URI: http://identity-provider:8080/realms/ewalleting/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: api-gateway
      KEYCLOAK_CLIENT_SECRET: api-gateway-dev-secret
      SSL_KEY_STORE: /certs/api-gateway-server.p12
      MTLS_CLIENT_KEY_STORE: /certs/api-gateway-client.p12
      MTLS_TRUST_STORE: /certs/truststore.p12
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      core-facade-rest:
        condition: service_healthy
      identity-provider:
        condition: service_healthy
    healthcheck:
      # -k: the healthcheck doesn't need to validate the chain, just confirm the
      # server answers — our mini CA isn't in the container's system trust store.
      test: ["CMD", "curl", "-fk", "https://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
