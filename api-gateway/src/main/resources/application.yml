spring:
  application:
    name: api-gateway
  security:
    oauth2:
      client:
        registration:
          core-facade:
            client-id: ${KEYCLOAK_CLIENT_ID:api-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:api-gateway-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          core-facade:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ewalleting/protocol/openid-connect/token}

server:
  port: 8080
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:../pki/certs/api-gateway-server.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:api-gateway-server}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # No separate management port here (unlike core-facade-rest) — api-gateway
  # doesn't require client certs on its own inbound side, so /actuator/health
  # just inherits the main port's plain server-auth HTTPS. Nothing extra needed.

# Overridden by CORE_FACADE_BASE_URL env var in docker-compose (service DNS name instead of localhost).
# https now — core-facade-rest requires mTLS, see mtls.client.* below.
downstream:
  core-facade-rest:
    base-url: ${CORE_FACADE_BASE_URL:https://localhost:8082}

gateway:
  rate-limit:
    requests-per-window: 20
    window-seconds: 10

# The identity api-gateway presents when IT calls core-facade-rest — separate
# from the server.ssl.* keystore above, which is what api-gateway presents to
# ITS OWN callers. See NOTES.md for why these are deliberately two different certs.
mtls:
  client:
    key-store: ${MTLS_CLIENT_KEY_STORE:../pki/certs/api-gateway-client.p12}
    key-store-password: ${MTLS_CLIENT_KEY_STORE_PASSWORD:changeit}
    trust-store: ${MTLS_TRUST_STORE:../pki/certs/truststore.p12}
    trust-store-password: ${MTLS_TRUST_STORE_PASSWORD:changeit}
