spring:
  application:
    name: api-gateway
  security:
    oauth2:
      client:
        registration:
          core-facade:
            client-id: ${KEYCLOAK_CLIENT_ID:api-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:api-gateway-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          core-facade:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ewalleting/protocol/openid-connect/token}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Overridden by CORE_FACADE_BASE_URL env var in docker-compose (service DNS name instead of localhost)
downstream:
  core-facade-rest:
    base-url: ${CORE_FACADE_BASE_URL:http://localhost:8082}

gateway:
  rate-limit:
    requests-per-window: 20
    window-seconds: 10
