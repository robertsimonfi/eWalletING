spring:
  application:
    name: core-facade-rest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ewalleting/protocol/openid-connect/certs}

server:
  port: 8082
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:../pki/certs/core-facade-server.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: core-facade-server
    # This is what makes it MUTUAL TLS: the server also demands a client
    # certificate, not just proving its own identity. "need" (vs "want") rejects
    # the handshake outright if no valid client cert is presented.
    client-auth: need
    trust-store: ${SSL_TRUST_STORE:../pki/certs/truststore.p12}
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD:changeit}
    trust-store-type: PKCS12

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  server:
    # A separate, plain-HTTP port for health/metrics only. server.ssl.client-auth:
    # need above applies to the WHOLE connector it's set on — a Docker healthcheck
    # (or any monitoring tool) has no client certificate to present, so it can't even
    # complete the TLS handshake to reach /actuator/health on the main mTLS port.
    # Splitting management onto its own port is the standard fix, not a workaround.
    # Spring Boot inherits server.ssl.* onto this port too unless told not to.
    port: 8092
    ssl:
      enabled: false

# Overridden by SOAP_ENDPOINT env var in docker-compose (service DNS name instead of localhost)
legacy-core-soap:
  endpoint: ${SOAP_ENDPOINT:http://localhost:8081/ws}

resilience4j:
  circuitbreaker:
    instances:
      legacyCoreSoap:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A "not found" SOAP fault is a normal business answer, not a technical failure —
        # it must not count toward tripping the breaker.
        ignore-exceptions:
          - org.springframework.ws.soap.client.SoapFaultClientException
